name: Build Mosaic Tracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Scaffold Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/mosaictracker
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          python3 - << 'PYEOF'
import os

def w(path, content):
    os.makedirs(os.path.dirname(path), exist_ok=True) if os.path.dirname(path) else None
    with open(path, 'w') as f:
        f.write(content)

w('settings.gradle', """\
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}
rootProject.name = "MosaicTracker"
include ':app'
""")

w('build.gradle', """\
plugins {
  id 'com.android.application' version '8.2.2' apply false
}
""")

w('app/build.gradle', """\
plugins {
  id 'com.android.application'
}
android {
  namespace 'com.mosaictracker'
  compileSdk 34
  defaultConfig {
    applicationId 'com.mosaictracker'
    minSdk 26
    targetSdk 34
    versionCode 1
    versionName '1.0'
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.6.1'
}
""")

w('app/src/main/AndroidManifest.xml', """\
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
  <uses-permission android:name="android.permission.INTERNET"/>
  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
    android:maxSdkVersion="32"/>
  <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
  <application
    android:label="Mosaic Tracker"
    android:allowBackup="true"
    android:usesCleartextTraffic="true"
    android:hardwareAccelerated="true"
    android:supportsRtl="true">
    <activity
      android:name=".MainActivity"
      android:exported="true"
      android:screenOrientation="portrait"
      android:windowSoftInputMode="adjustResize">
      <intent-filter>
        <action android:name="android.intent.action.MAIN"/>
        <category android:name="android.intent.category.LAUNCHER"/>
      </intent-filter>
    </activity>
  </application>
</manifest>
""")

w('app/src/main/res/xml/network_security_config.xml', """\
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
  <base-config cleartextTrafficPermitted="true"/>
</network-security-config>
""")

w('app/src/main/res/values/strings.xml', """\
<?xml version="1.0" encoding="utf-8"?>
<resources>
  <string name="app_name">Mosaic Tracker</string>
</resources>
""")

w('app/src/main/java/com/mosaictracker/MainActivity.java', """\
package com.mosaictracker;

import android.content.Context;
import android.content.SharedPreferences;
import android.net.Uri;
import android.os.Bundle;
import android.webkit.JavascriptInterface;
import android.webkit.ValueCallback;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.app.Activity;
import android.content.Intent;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {

  private WebView webView;
  private ValueCallback<Uri[]> filePathCallback;
  private static final int FILE_CHOOSER_REQUEST = 1;

  @Override
  protected void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    webView = new WebView(this);
    setContentView(webView);

    WebSettings ws = webView.getSettings();
    ws.setJavaScriptEnabled(true);
    ws.setDomStorageEnabled(true);
    ws.setAllowFileAccess(true);
    ws.setAllowContentAccess(true);
    ws.setMediaPlaybackRequiresUserGesture(false);

    webView.addJavascriptInterface(new StorageBridge(this), "AndroidStorage");
    webView.addJavascriptInterface(new NativeBridge(this), "NativeBridge");

    webView.setWebViewClient(new WebViewClient());
    webView.setWebChromeClient(new WebChromeClient() {
      @Override
      public boolean onShowFileChooser(WebView wv,
          ValueCallback<Uri[]> cb,
          FileChooserParams params) {
        filePathCallback = cb;
        Intent i = new Intent(Intent.ACTION_GET_CONTENT);
        i.addCategory(Intent.CATEGORY_OPENABLE);
        i.setType("image/*");
        startActivityForResult(Intent.createChooser(i, "Select Chart Image"), FILE_CHOOSER_REQUEST);
        return true;
      }
    });

    webView.loadUrl("file:///android_asset/index.html");
  }

  @Override
  protected void onActivityResult(int requestCode, int resultCode, Intent data) {
    super.onActivityResult(requestCode, resultCode, data);
    if (requestCode == FILE_CHOOSER_REQUEST) {
      if (filePathCallback == null) return;
      Uri[] results = null;
      if (resultCode == Activity.RESULT_OK && data != null) {
        String dataStr = data.getDataString();
        if (dataStr != null) results = new Uri[]{Uri.parse(dataStr)};
      }
      filePathCallback.onReceiveValue(results);
      filePathCallback = null;
    }
  }

  @Override
  public void onBackPressed() {
    if (webView.canGoBack()) webView.goBack();
    else super.onBackPressed();
  }

  public class StorageBridge {
    private final SharedPreferences prefs;
    StorageBridge(Context ctx) {
      prefs = ctx.getSharedPreferences("MosaicTrackerData", Context.MODE_PRIVATE);
    }
    @JavascriptInterface
    public String get(String key) { return prefs.getString(key, null); }
    @JavascriptInterface
    public void set(String key, String value) {
      prefs.edit().putString(key, value).apply();
    }
    @JavascriptInterface
    public void remove(String key) { prefs.edit().remove(key).apply(); }
  }

  public class NativeBridge {
    private final StorageBridge sb;
    NativeBridge(Context ctx) { sb = new StorageBridge(ctx); }
    @JavascriptInterface
    public String getItem(String key) { return sb.get(key); }
    @JavascriptInterface
    public void setItem(String key, String value) { sb.set(key, value); }
    @JavascriptInterface
    public void removeItem(String key) { sb.remove(key); }
  }
}
""")

import shutil
shutil.copy('index.html', 'app/src/main/assets/index.html')
print("All files written.")
PYEOF

          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Mosaic Tracker, OU=Dev, O=Daniel, L=Unknown, S=Unknown, C=US"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out mosaic-tracker.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-tracker-apk
          path: mosaic-tracker.apk
          retention-days: 30

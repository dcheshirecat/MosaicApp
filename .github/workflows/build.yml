name: Build Mosaic Tracker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Install Android SDK Platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Scaffold Android project
        run: |
          set -e
          mkdir -p app/src/main/java/com/mosaictracker
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/assets

          sed 's/^          //' << 'PYEOF' | python3 -
          import os

          def w(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True) if os.path.dirname(path) else None
              with open(path, 'w') as f:
                  f.write(content)

          w('settings.gradle', """\
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "MosaicTracker"
          include ':app'
          """)

          w('gradle.properties', """\
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          """)

          w('build.gradle', """\
          plugins {
            id 'com.android.application' version '8.2.2' apply false
          }
          """)

          w('app/build.gradle', """\
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.mosaictracker'
            compileSdk 35
            defaultConfig {
              applicationId 'com.mosaictracker'
              minSdk 26
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
            signingConfigs {
              release {
                storeFile file(System.getenv("MOSAIC_KEYSTORE_PATH") ?: "nonexistent.jks")
                storePassword System.getenv("MOSAIC_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MOSAIC_KEY_ALIAS")
                keyPassword System.getenv("MOSAIC_KEYSTORE_PASSWORD")
              }
            }
            buildTypes {
              release {
                minifyEnabled false
                signingConfig signingConfigs.release
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
          }
          """)

          w('app/src/main/AndroidManifest.xml', """\
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
              android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
            <application
              android:label="Mosaic Tracker"
              android:icon="@mipmap/ic_launcher"
              android:roundIcon="@mipmap/ic_launcher_round"
              android:allowBackup="true"
              android:usesCleartextTraffic="true"
              android:hardwareAccelerated="true"
              android:supportsRtl="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait"
                android:windowSoftInputMode="adjustResize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          """)

          w('app/src/main/res/xml/network_security_config.xml', """\
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true"/>
          </network-security-config>
          """)

          w('app/src/main/res/drawable/ic_launcher_background.xml', """\
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#1A1A2E" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          """)

          w('app/src/main/res/drawable/ic_launcher_foreground.xml', """\
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#E94560" android:pathData="M54,27 L81,54 L54,81 L27,54 Z"/>
            <path android:fillColor="#1A1A2E" android:pathData="M54,44 L64,54 L54,64 L44,54 Z"/>
          </vector>
          """)

          w('app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml', """\
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """)

          w('app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml', """\
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """)

          w('app/src/main/res/values/strings.xml', """\
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Mosaic Tracker</string>
          </resources>
          """)

          w('app/src/main/java/com/mosaictracker/MainActivity.java', """\
          package com.mosaictracker;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.app.Activity;
          import android.content.Intent;

          public class MainActivity extends Activity {

            private WebView webView;
            private ValueCallback<Uri[]> filePathCallback;
            private static final int FILE_CHOOSER_REQUEST = 1;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              webView = new WebView(this);
              setContentView(webView);

              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setAllowFileAccess(true);
              ws.setAllowContentAccess(true);
              ws.setMediaPlaybackRequiresUserGesture(false);

              webView.addJavascriptInterface(new StorageBridge(this), "AndroidStorage");
              webView.addJavascriptInterface(new NativeBridge(this), "NativeBridge");

              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView wv,
                    ValueCallback<Uri[]> cb,
                    FileChooserParams params) {
                  filePathCallback = cb;
                  String[] acceptTypes = params.getAcceptTypes();
                  java.util.List<String> mimeList = new java.util.ArrayList<>();
                  if (acceptTypes != null) {
                    for (String t : acceptTypes) {
                      if (t != null && !t.isEmpty() && !t.equals("*/*")) mimeList.add(t);
                    }
                  }
                  // ACTION_OPEN_DOCUMENT opens the system Files browser (Downloads,
                  // This device, Drive, etc). ACTION_GET_CONTENT with an image/* type
                  // gets intercepted by the Android Photo Picker instead, which is
                  // not what we want when the user is picking a saved chart file.
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  // Always set the base type to */* and narrow via EXTRA_MIME_TYPES.
                  // Passing a specific type (e.g. "application/pdf") directly to
                  // setType() makes some OEM document pickers only surface providers
                  // that explicitly advertise that exact type, which in practice
                  // often collapses the chooser down to just the Photos view. Using
                  // */* + EXTRA_MIME_TYPES is the pattern Android itself recommends
                  // for filtering by type while still showing every provider
                  // (Drive, Downloads, Files, WhatsApp, etc).
                  i.setType("*/*");
                  if (!mimeList.isEmpty()) {
                    i.putExtra(Intent.EXTRA_MIME_TYPES, mimeList.toArray(new String[0]));
                  }
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  try {
                    startActivityForResult(i, FILE_CHOOSER_REQUEST);
                  } catch (Exception e) {
                    filePathCallback = null;
                    return false;
                  }
                  return true;
                }
              });

              webView.loadUrl("file:///android_asset/index.html");
            }

            @Override
            protected void onActivityResult(int requestCode, int resultCode, Intent data) {
              super.onActivityResult(requestCode, resultCode, data);
              if (requestCode == FILE_CHOOSER_REQUEST) {
                if (filePathCallback == null) return;
                Uri[] results = null;
                if (resultCode == Activity.RESULT_OK && data != null) {
                  String dataStr = data.getDataString();
                  if (dataStr != null) results = new Uri[]{Uri.parse(dataStr)};
                }
                filePathCallback.onReceiveValue(results);
                filePathCallback = null;
              }
            }

            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }

            public class StorageBridge {
              private final SharedPreferences prefs;
              StorageBridge(Context ctx) {
                prefs = ctx.getSharedPreferences("MosaicTrackerData", Context.MODE_PRIVATE);
              }
              @JavascriptInterface
              public String get(String key) { return prefs.getString(key, null); }
              @JavascriptInterface
              public void set(String key, String value) {
                prefs.edit().putString(key, value).apply();
              }
              @JavascriptInterface
              public void remove(String key) { prefs.edit().remove(key).apply(); }
            }

            public class NativeBridge {
              private final StorageBridge sb;
              NativeBridge(Context ctx) { sb = new StorageBridge(ctx); }
              @JavascriptInterface
              public String getItem(String key) { return sb.get(key); }
              @JavascriptInterface
              public void setItem(String key, String value) { sb.set(key, value); }
              @JavascriptInterface
              public void removeItem(String key) { sb.remove(key); }
            }
          }
          """)

          import shutil
          shutil.copy('index.html', 'app/src/main/assets/index.html')
          print("All files written.")
          PYEOF

          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew

      - name: Bundle pdf.js for offline use
        run: |
          set -e
          mkdir -p app/src/main/assets/vendor
          # Same version index.html's CDN fallback points at — keep these in sync.
          PDFJS_VERSION=3.11.174
          curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.js" \
            -o app/src/main/assets/vendor/pdf.min.js
          curl -fsSL "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.js" \
            -o app/src/main/assets/vendor/pdf.worker.min.js
          # Fail the build loudly if either file didn't actually come down —
          # better to catch a broken PDF-import feature here than to ship
          # an APK where it silently falls back to needing a connection.
          test -s app/src/main/assets/vendor/pdf.min.js
          test -s app/src/main/assets/vendor/pdf.worker.min.js

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MOSAIC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MOSAIC_KEYSTORE_BASE64 repo secret is not set — see the keystore setup instructions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mosaic-tracker-release.jks"

      - name: Build signed release APK and AAB
        env:
          MOSAIC_KEYSTORE_PATH: ${{ runner.temp }}/mosaic-tracker-release.jks
          MOSAIC_KEYSTORE_PASSWORD: ${{ secrets.MOSAIC_KEYSTORE_PASSWORD }}
          MOSAIC_KEY_ALIAS: ${{ secrets.MOSAIC_KEY_ALIAS }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect signed outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk mosaic-tracker.apk
          cp app/build/outputs/bundle/release/app-release.aab mosaic-tracker.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-tracker-apk
          path: mosaic-tracker.apk
          retention-days: 30

      - name: Upload AAB artifact (for Google Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-tracker-aab
          path: mosaic-tracker.aab
          retention-days: 30
